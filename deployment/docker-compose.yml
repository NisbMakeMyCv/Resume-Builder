# =============================================================================
# MakeMyCV — Full Stack Production Compose
#
# Usage:
#   docker compose up -d
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Nginx Reverse Proxy
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: makemycv-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - makemycv-net

  # ---------------------------------------------------------------------------
  # Next.js Frontend
  # ---------------------------------------------------------------------------
  frontend:
    # Uses pre-built image (pushed by CI)
    image: ${DOCKER_USERNAME:-makemycv}/makemycv-frontend:latest
    container_name: makemycv-frontend
    restart: always
    # Next.js standalone runs on 3000 by default inside the container
    expose:
      - "3000"
    environment:
      # Tell the frontend that the API is accessible on the same domain at /api/v1
      - NEXT_PUBLIC_API_URL=/api/v1
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - makemycv-net

  # ---------------------------------------------------------------------------
  # FastAPI Backend
  # ---------------------------------------------------------------------------
  api:
    image: ${DOCKER_USERNAME:-makemycv}/makemycv-backend:latest
    container_name: makemycv-api
    restart: always
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-makemycv_user}:${POSTGRES_PASSWORD}@db:5432/makemycv_db
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - EMAILS_FROM_EMAIL=${EMAILS_FROM_EMAIL}
      - GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - makemycv-net

  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: makemycv-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-makemycv_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: makemycv_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-makemycv_user} -d makemycv_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - makemycv-net

volumes:
  postgres_data:

networks:
  makemycv-net:
    driver: bridge
