# =============================================================================
# MakeMyCV — API Gateway Production Compose (Backend Only)
#
# Usage:
#   docker compose up -d
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Nginx Reverse Proxy (API Gateway)
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: makemycv-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    healthcheck:
      test: ["CMD-SHELL", "nginx -t || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      api:
        condition: service_healthy
    networks:
      - makemycv-net

  # ---------------------------------------------------------------------------
  # FastAPI Backend
  # ---------------------------------------------------------------------------
  api:
    image: ${DOCKER_USERNAME:-makemycv}/makemycv-backend:latest
    container_name: makemycv-api
    restart: always
    expose:
      - "8000"
    environment:
      # Now relies on Supabase for the database connection
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - EMAILS_FROM_EMAIL=${EMAILS_FROM_EMAIL}
      - GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - TOKEN_GITHUB=${TOKEN_GITHUB}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - makemycv-net

networks:
  makemycv-net:
    driver: bridge
