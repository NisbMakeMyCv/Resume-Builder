name: Production Deploy

on:
  push:
    branches:
      - feature/integration01 # Trigger on merges/pushes to main branch
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'deployment/**'
      - 'nginx/**'
      - '.github/workflows/**'
  workflow_dispatch: # Allow manual triggering

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------
  # JOB 1: Test & Lint Backend
  # -------------------------------------------------------------------------
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d testdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt pytest httpx

      - name: Run Pytest
        working-directory: backend
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb
          JWT_SECRET_KEY: testsecret
          SMTP_USER: test
          SMTP_PASSWORD: test
          EMAILS_FROM_EMAIL: test@test.com
        run: pytest

  # -------------------------------------------------------------------------
  # JOB 2: Build & Push Backend Image
  # -------------------------------------------------------------------------
  build-backend:
    name: Build & Push Backend Docker Image
    runs-on: ubuntu-latest
    needs: [test-backend]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/makemycv-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/makemycv-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------------------
  # JOB 3: Build & Push Frontend Image
  # -------------------------------------------------------------------------
  build-frontend:
    name: Build & Push Frontend Docker Image
    runs-on: ubuntu-latest
    # Assuming no frontend test job exists yet; otherwise add needs: [test-frontend]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/makemycv-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/makemycv-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------------------
  # JOB 4: Auto-Provision Infrastructure (Terraform)
  # -------------------------------------------------------------------------
  provision:
    name: Provision EC2 Infrastructure
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    outputs:
      ec2_ip: ${{ steps.ec2-ip.outputs.ip }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Provision AWS EC2 Instance via Terraform
        working-directory: terraform
        env:
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
          TF_VAR_allowed_ssh_cidr: "0.0.0.0/0"
        run: |
          terraform init
          terraform apply -auto-approve

      - name: Discover EC2 Instance IP
        id: ec2-ip
        run: |
          # Query AWS for the EC2 instance with matching tags
          for i in {1..10}; do
            INSTANCE_IP=$(aws ec2 describe-instances \
              --filters "Name=tag:Role,Values=AppServer" "Name=tag:Project,Values=MakeMyCV" "Name=instance-state-name,Values=running" \
              --query "Reservations[0].Instances[0].PublicIpAddress" \
              --output text)
            
            if [ "$INSTANCE_IP" != "None" ] && [ -n "$INSTANCE_IP" ]; then
              echo "Found EC2 Instance IP: $INSTANCE_IP"
              echo "ip=$INSTANCE_IP" >> $GITHUB_OUTPUT
              exit 0
            fi
            sleep 3
          done

          echo "Error: Could not find a running EC2 instance after provisioning."
          exit 1

  # -------------------------------------------------------------------------
  # JOB 5: Deploy Application to EC2
  # -------------------------------------------------------------------------
  deploy:
    name: Deploy Application to EC2
    runs-on: ubuntu-latest
    needs: [provision]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          # Add the known host key securely if available, otherwise fallback to keyscan
          if [ -n "${{ secrets.EC2_HOST_KEY }}" ]; then
            echo "${{ secrets.EC2_HOST_KEY }}" >> ~/.ssh/known_hosts
          else
            ssh-keyscan -H ${{ needs.provision.outputs.ec2_ip }} >> ~/.ssh/known_hosts
          fi

      - name: Wait for EC2 & Docker Bootstrap Readiness
        run: |
          echo "Waiting for EC2 SSH and Docker to finish bootstrapping..."
          for i in {1..30}; do
            if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 -i ~/.ssh/id_rsa ubuntu@${{ needs.provision.outputs.ec2_ip }} "docker --version" >/dev/null 2>&1; then
              echo "EC2 Server and Docker Engine are ready! 🚀"
              exit 0
            fi
            echo "Waiting for Docker bootstrap to complete... ($i/30)"
            sleep 5
          done
          echo "Error: Timed out waiting for Docker engine on EC2."
          exit 1

      - name: Copy Deployment Files
        run: |
          # Create deployment directory on server
          ssh -i ~/.ssh/id_rsa ubuntu@${{ needs.provision.outputs.ec2_ip }} "mkdir -p ~/deployment/nginx"
          
          # Copy docker-compose and nginx config
          scp -i ~/.ssh/id_rsa deployment/docker-compose.yml ubuntu@${{ needs.provision.outputs.ec2_ip }}:~/deployment/
          scp -i ~/.ssh/id_rsa nginx/nginx.conf ubuntu@${{ needs.provision.outputs.ec2_ip }}:~/deployment/nginx/

      - name: Create .env on Server
        run: |
          cat > .env.prod << 'EOF'
          DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD=${{ secrets.DOCKER_PASSWORD }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
          SMTP_USER=${{ secrets.SMTP_USER }}
          SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
          EMAILS_FROM_EMAIL=${{ secrets.EMAILS_FROM_EMAIL }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          EOF
          
          # Remove leading whitespace caused by heredoc indentation
          sed -i 's/^[ \t]*//' .env.prod
          
          scp -i ~/.ssh/id_rsa .env.prod ubuntu@${{ needs.provision.outputs.ec2_ip }}:~/deployment/.env

      - name: Deploy Containers
        run: |
          ssh -i ~/.ssh/id_rsa ubuntu@${{ needs.provision.outputs.ec2_ip }} << 'EOF'
            cd ~/deployment
            # Source environment variables
            set -a
            source .env
            set +a
            # Log in to Docker Hub to allow pulling private repositories
            if [ -n "$DOCKER_USERNAME" ] && [ -n "$DOCKER_PASSWORD" ]; then
              echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin 2>/dev/null || true
            fi
            # Pull latest images
            docker compose pull
            # Restart containers (recreates only if image changed)
            docker compose up -d
            
            # Prune old images to save space ONLY AFTER everything is running
            # Sleep briefly to ensure containers are fully up before pruning
            sleep 10
            docker image prune -af
          EOF

      - name: Verify Deployment
        run: |
          echo "Waiting for services to become healthy..."
          sleep 15
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://${{ needs.provision.outputs.ec2_ip }})
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Health check failed! Status: $HTTP_STATUS"
            exit 1
          fi
          echo "Deployment verified ✅ — HTTP $HTTP_STATUS — Application is LIVE at http://${{ needs.provision.outputs.ec2_ip }}"
