name: Production Deploy

on:
  push:
    branches:
      - feature/integration01 # Trigger on merges/pushes to main branch
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'deployment/**'
      - 'nginx/**'
      - 'terraform/**'
      - '.github/workflows/**'
  workflow_dispatch: # Allow manual triggering

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------
  # JOB 1: Test & Lint Backend
  # -------------------------------------------------------------------------
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d testdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt pytest httpx

      - name: Run Pytest
        working-directory: backend
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb
          JWT_SECRET_KEY: testsecret
          SMTP_USER: test
          SMTP_PASSWORD: test
          EMAILS_FROM_EMAIL: test@test.com
        run: pytest

  # -------------------------------------------------------------------------
  # JOB 2: Build & Push Backend Image
  # -------------------------------------------------------------------------
  build-backend:
    name: Build & Push Backend Docker Image
    runs-on: ubuntu-latest
    needs: [test-backend]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/makemycv-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/makemycv-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------------------
  # JOB 3: Build & Push Frontend Image
  # -------------------------------------------------------------------------
  build-frontend:
    name: Build & Push Frontend Docker Image
    runs-on: ubuntu-latest
    # Assuming no frontend test job exists yet; otherwise add needs: [test-frontend]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/makemycv-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/makemycv-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------------------
  # JOB 4: Auto-Provision Infrastructure (Terraform)
  # -------------------------------------------------------------------------
  provision:
    name: Provision EC2 Infrastructure
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    outputs:
      ec2_ip: ${{ steps.ec2-ip.outputs.ip }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Provision Infrastructure & Get IP
        id: ec2-ip
        env:
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
          TF_VAR_allowed_ssh_cidr: "0.0.0.0/0"
        run: |
          cd terraform
          
          echo "Initializing Terraform with S3 Remote Backend..."
          # Credentials are automatically provided by the configure-aws-credentials step above
          terraform init
          
          echo "Applying infrastructure..."
          terraform apply -auto-approve
          
          # Extract the IP directly from Terraform's output! No more manual AWS queries!
          INSTANCE_IP=$(terraform output -raw instance_public_ip)
          
          if [ -z "$INSTANCE_IP" ]; then
            echo "Error: Failed to retrieve EC2 IP from Terraform output."
            exit 1
          fi
          
          echo "App Server IP: $INSTANCE_IP ✅"
          echo "ip=$INSTANCE_IP" >> $GITHUB_OUTPUT

  # -------------------------------------------------------------------------
  # JOB 5: Deploy Application to EC2
  # -------------------------------------------------------------------------
  deploy:
    name: Deploy Application to EC2
    runs-on: ubuntu-latest
    needs: [provision]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update DuckDNS IP Record
        env:
          DUCKDNS_TOKEN: ${{ secrets.DUCKDNS_TOKEN }}
        run: |
          if [ -n "$DUCKDNS_TOKEN" ]; then
            echo "Updating DuckDNS IP for nisbmakemycv.duckdns.org to ${{ needs.provision.outputs.ec2_ip }}..."
            RESPONSE=$(curl -s "https://www.duckdns.org/update?domains=nisbmakemycv&token=${DUCKDNS_TOKEN}&ip=${{ needs.provision.outputs.ec2_ip }}")
            echo "DuckDNS Response: $RESPONSE"
          else
            echo "⚠️ DUCKDNS_TOKEN secret is not set in GitHub Secrets. Skipping DNS update."
          fi

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          # Add the known host key securely if available, otherwise fallback to keyscan
          if [ -n "${{ secrets.EC2_HOST_KEY }}" ]; then
            echo "${{ secrets.EC2_HOST_KEY }}" >> ~/.ssh/known_hosts
          else
            ssh-keyscan -H ${{ needs.provision.outputs.ec2_ip }} >> ~/.ssh/known_hosts
          fi

      - name: Wait for EC2 Boot Sequence and Docker
        run: |
          echo "Waiting for EC2 SSH to become available..."
          SSH_READY=false
          for i in {1..30}; do
            if ssh -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=5 -i ~/.ssh/id_rsa ubuntu@${{ needs.provision.outputs.ec2_ip }} "echo 'SSH is up'" >/dev/null 2>&1; then
              SSH_READY=true
              echo "SSH connection established! ✅"
              break
            fi
            echo "Waiting for SSH... ($i/30)"
            sleep 5
          done

          if [ "$SSH_READY" = false ]; then
            echo "Error: Timed out waiting for SSH."
            exit 1
          fi

          echo "Waiting for cloud-init background updates and user_data scripts to complete..."
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ubuntu@${{ needs.provision.outputs.ec2_ip }} "sudo cloud-init status --wait || true"

          echo "Checking Docker installation status..."
          if ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ubuntu@${{ needs.provision.outputs.ec2_ip }} "docker --version" >/dev/null 2>&1; then
            echo "EC2 Server and Docker Engine are ready! 🚀"
          else
            echo "Docker not found after cloud-init. Installing via official Docker script..."
            ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ubuntu@${{ needs.provision.outputs.ec2_ip }} "curl -fsSL https://get.docker.com | sudo sh && sudo usermod -aG docker ubuntu"
            echo "Docker installed successfully! 🚀"
          fi

      - name: Copy Deployment Files
        run: |
          # Create deployment directory on server
          ssh -i ~/.ssh/id_rsa ubuntu@${{ needs.provision.outputs.ec2_ip }} "mkdir -p ~/deployment/nginx"
          
          # Copy docker-compose and nginx config
          scp -i ~/.ssh/id_rsa deployment/docker-compose.yml ubuntu@${{ needs.provision.outputs.ec2_ip }}:~/deployment/
          scp -i ~/.ssh/id_rsa nginx/nginx.conf ubuntu@${{ needs.provision.outputs.ec2_ip }}:~/deployment/nginx/

      - name: Create .env on Server
        run: |
          cat > .env.prod << 'EOF'
          DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD=${{ secrets.DOCKER_PASSWORD }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
          SMTP_USER=${{ secrets.SMTP_USER }}
          SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
          EMAILS_FROM_EMAIL=${{ secrets.EMAILS_FROM_EMAIL }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          ALLOWED_ORIGINS=https://nisbmakemycv.duckdns.org
          EOF
          
          # Remove leading whitespace caused by heredoc indentation
          sed -i 's/^[ \t]*//' .env.prod
          
          scp -i ~/.ssh/id_rsa .env.prod ubuntu@${{ needs.provision.outputs.ec2_ip }}:~/deployment/.env

      - name: Bootstrap Dummy SSL Certificate
        run: |
          ssh -i ~/.ssh/id_rsa ubuntu@${{ needs.provision.outputs.ec2_ip }} << 'EOF'
            echo "Checking if SSL Certificate exists for nisbmakemycv.duckdns.org..."
            sudo mkdir -p /etc/letsencrypt/live/nisbmakemycv.duckdns.org
            if [ ! -f "/etc/letsencrypt/live/nisbmakemycv.duckdns.org/fullchain.pem" ]; then
              echo "Creating a dummy self-signed certificate so Nginx can start..."
              sudo openssl req -x509 -nodes -days 1 -newkey rsa:2048 \
                -keyout /etc/letsencrypt/live/nisbmakemycv.duckdns.org/privkey.pem \
                -out /etc/letsencrypt/live/nisbmakemycv.duckdns.org/fullchain.pem \
                -subj "/CN=nisbmakemycv.duckdns.org"
            fi
          EOF

      - name: Deploy Containers
        run: |
          ssh -i ~/.ssh/id_rsa ubuntu@${{ needs.provision.outputs.ec2_ip }} << 'EOF'
            cd ~/deployment
            set -a
            source .env
            set +a
            if [ -n "$DOCKER_USERNAME" ] && [ -n "$DOCKER_PASSWORD" ]; then
              echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin 2>/dev/null || true
            fi
            docker compose pull
            docker compose up -d
            sleep 10
            docker image prune -af
          EOF

      - name: Obtain Let's Encrypt SSL Certificate
        run: |
          ssh -i ~/.ssh/id_rsa ubuntu@${{ needs.provision.outputs.ec2_ip }} << 'EOF'
            sudo mkdir -p /var/www/certbot
            echo "Requesting real SSL certificate via Certbot webroot..."
            sudo certbot certonly --webroot -w /var/www/certbot -d nisbmakemycv.duckdns.org --non-interactive --agree-tos --register-unsafely-without-email --force-renewal || true
            echo "Restarting Nginx to load the new certificate..."
            docker compose -f /home/ubuntu/deployment/docker-compose.yml restart nginx || true
          EOF

      - name: Verify Deployment & Output Live Links
        run: |
          echo "Waiting for services to become healthy..."
          IP="${{ needs.provision.outputs.ec2_ip }}"
          DOMAIN="nisbmakemycv.duckdns.org"
          
          MAX_RETRIES=15
          RETRY_INTERVAL=10
          SUCCESS=false
          
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Health check attempt $i/$MAX_RETRIES..."
            # --resolve bypasses DNS propagation delays by forcing curl to hit the new EC2 IP directly.
            # || echo "000" prevents bash from aborting the script if curl fails to connect (exit code 7).
            HTTP_STATUS=$(curl -s -L --resolve ${DOMAIN}:443:${IP} -o /dev/null -w "%{http_code}" https://${DOMAIN} || echo "000")
            
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "✅ Health check passed! Status code: 200"
              SUCCESS=true
              break
            fi
            
            echo "⚠️ Health check returned: $HTTP_STATUS. Retrying in $RETRY_INTERVAL seconds..."
            sleep $RETRY_INTERVAL
          done
          
          if [ "$SUCCESS" = false ]; then
            echo "❌ Health check failed after $MAX_RETRIES attempts!"
            exit 1
          fi

          echo ""
          echo "=========================================================================="
          echo "🎉 APPLICATION IS LIVE AND HEALTHY! (HTTP $HTTP_STATUS)"
          echo "=========================================================================="
          echo "🌐 Domain URL:   https://${DOMAIN}"
          echo "🌐 App IP URL:  http://${IP}"
          echo "⚙️ API URL:     https://${DOMAIN}/api/v1"
          echo "📚 Swagger Docs: https://${DOMAIN}/docs"
          echo "🔑 SSH Command:  ssh ubuntu@${IP}"
          echo "=========================================================================="
          echo ""

          # Populate GitHub Actions Job Summary (renders at top of GitHub Actions UI)
          cat << EOF >> $GITHUB_STEP_SUMMARY
          ### 🚀 Deployment Successful & Verified!

          | Resource | URL / Command |
          |---|---|
          | **🌐 Custom Domain** | [https://${DOMAIN}](https://${DOMAIN}) |
          | **🌐 Direct Server IP** | [http://${IP}](http://${IP}) |
          | **⚙️ Backend API** | [https://${DOMAIN}/api/v1](https://${DOMAIN}/api/v1) |
          | **📚 Swagger Docs** | [https://${DOMAIN}/docs](https://${DOMAIN}/docs) |
          | **🔑 SSH Access** | \`ssh ubuntu@${IP}\` |

          *Deployed successfully at $(date)*
          EOF
