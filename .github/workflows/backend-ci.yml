# =============================================================================
# Backend CI Pipeline: Test → Build → Push
#
# Triggers:
#   - push to feature/backend-setup
#   - pull_request targeting feature/backend-setup
#   - ONLY when files inside backend/ are changed
#
# Jobs:
#   1. test   — Pytest against a live PostgreSQL service container
#   2. build  — Docker build & push (only if 'test' passes, only on push)
# =============================================================================

name: Backend CI

on:
  push:
    branches:
      - feature/backend-setup
    paths:
      - "backend/**"          # ← Only trigger when backend files change
  pull_request:
    branches:
      - feature/backend-setup
    paths:
      - "backend/**"
  workflow_dispatch:          # ← Adds a "Run workflow" button in GitHub Actions UI

# Cancel in-progress runs on the same branch when a new commit is pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────────────────────
# JOB 1: Run Tests
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  test:
    name: 🧪 Run Pytest (backend/)
    runs-on: ubuntu-latest

    # PostgreSQL service container — lives on localhost:5432 for the runner.
    # The health-check ensures the DB is fully ready before pytest starts,
    # which is critical because app/main.py calls create_all() at import time.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d testdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # 1. Check out the full repository
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python — matches the version pinned in the Dockerfile
      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt  # cache key tied to backend deps

      # 3. Install all Python dependencies from backend/requirements.txt
      - name: 📦 Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      # 4. Run pytest from inside the backend/ directory.
      #    DATABASE_URL is injected here so conftest.py sets it before
      #    SQLAlchemy initialises the engine.
      - name: ✅ Run pytest
        working-directory: backend
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAILS_FROM_EMAIL: ${{ secrets.EMAILS_FROM_EMAIL }}
        run: pytest

# ─────────────────────────────────────────────────────────────────────────────
# JOB 2: Build & Push Docker Image
#
# Only runs when:
#   a) Job 1 (test) passes           → needs: test
#   b) This is a direct push event   → not a PR (avoids leaking secrets to forks)
# ─────────────────────────────────────────────────────────────────────────────
  build:
    name: 🐳 Build & Push Docker Image (backend/)
    runs-on: ubuntu-latest
    needs: test

    # Skip this job on pull_request events — only push on direct commits or manual triggers.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      # 1. Check out code (required as the Docker build context)
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      # 2. Enable Docker Buildx (required for build cache and multi-platform support)
      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Inject GitHub Secrets into .env so Docker Compose gets a fully
      #    populated file without any real credentials stored in the repo.
      #    The .env already contains non-sensitive defaults (SMTP_HOST, etc.);
      #    this step only overwrites the placeholder values.
      - name: 🔐 Inject secrets into .env
        working-directory: backend
        env:
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAILS_FROM_EMAIL: ${{ secrets.EMAILS_FROM_EMAIL }}
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          # Overwrite placeholder values already in .env
          sed -i "s|JWT_SECRET_KEY=.*|JWT_SECRET_KEY=${JWT_SECRET_KEY}|"         .env
          sed -i "s|SMTP_USER=.*|SMTP_USER=${SMTP_USER}|"                         .env
          sed -i "s|SMTP_PASSWORD=.*|SMTP_PASSWORD=${SMTP_PASSWORD}|"             .env
          sed -i "s|EMAILS_FROM_EMAIL=.*|EMAILS_FROM_EMAIL=${EMAILS_FROM_EMAIL}|" .env
          # Append DOCKER_HUB_USERNAME so docker-compose.yml resolves ${DOCKER_HUB_USERNAME}
          echo "DOCKER_HUB_USERNAME=${DOCKER_HUB_USERNAME}" >> .env
          echo ".env secrets injection complete."

      # 4. Authenticate to Docker Hub using GitHub Secrets
      - name: 🔑 Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 4. Auto-generate image tags:
      #      latest               → always on push to this branch
      #      <short-sha>          → e.g. abc1234, unique per commit
      - name: 🏷️ Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/makemycv-backend
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      # 5. Build from backend/Dockerfile, using backend/ as the context,
      #    then push both tags to Docker Hub.
      #    GitHub Actions cache (type=gha) speeds up layer reuse across runs.
      - name: 🚀 Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./backend           # build context = backend/ directory
          file: ./backend/Dockerfile   # explicit Dockerfile path
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
